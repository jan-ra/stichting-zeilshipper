name: Update ship positions from AIS

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC nightly (03:00 CET / 04:00 CEST)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 10-min AIS listen cap + checkout/npm ci/patch overhead
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cms/package-lock.json

      - name: Install CMS dependencies
        working-directory: cms
        run: npm ci

      - name: Update ship positions
        working-directory: cms
        env:
          PAYLOAD_API_URL:       ${{ secrets.PAYLOAD_API_URL }}
          AISSTREAM_API_KEY:     ${{ secrets.AISSTREAM_API_KEY }}
          POSITION_BOT_API_KEY:  ${{ secrets.POSITION_BOT_API_KEY }}
        run: node scripts/update-positions.mjs
