<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f2238"/>
  <!-- Ship wheel (roer) in gold -->
  <!-- Hub -->
  <circle cx="16" cy="16" r="2.8" fill="#c19a52"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#c19a52" stroke-width="1.5"/>
  <!-- 8 spokes -->
  <line x1="16" y1="6.5" x2="16" y2="25.5" stroke="#c19a52" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#c19a52" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="9.3" y1="9.3" x2="22.7" y2="22.7" stroke="#c19a52" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="22.7" y1="9.3" x2="9.3" y2="22.7" stroke="#c19a52" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Spoke end caps (handles) -->
  <circle cx="16" cy="6" r="1.4" fill="#c19a52"/>
  <circle cx="16" cy="26" r="1.4" fill="#c19a52"/>
  <circle cx="6" cy="16" r="1.4" fill="#c19a52"/>
  <circle cx="26" cy="16" r="1.4" fill="#c19a52"/>
  <circle cx="8.9" cy="8.9" r="1.4" fill="#c19a52"/>
  <circle cx="23.1" cy="23.1" r="1.4" fill="#c19a52"/>
  <circle cx="23.1" cy="8.9" r="1.4" fill="#c19a52"/>
  <circle cx="8.9" cy="23.1" r="1.4" fill="#c19a52"/>
</svg>
