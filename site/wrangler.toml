name = "stichting-zeilshipper"
compatibility_date = "2025-01-01"

# Workers Static Assets. Serves the Vite build from ./dist.
# SPA fallback: unknown paths (e.g. /blog/my-post) serve index.html so the
# React router can handle them client-side.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
